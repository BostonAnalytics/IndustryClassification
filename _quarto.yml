project:
  type: website
  output-dir: _site
  render:
    - '*.qmd'
    - '!final_report.qmd'
  resources:
    - data/*.csv
    - data/study/*.csv
    - data/study/*.json
    - data/eda/*.csv
    - data/eda/run.json
    - data/sample/run.json
    - reference.bib
    - final_report.docx
website:
  title: Healthcare Analyst Careers
  description: A scoped career evaluation study of healthcare data analyst postings and employer industry labels.
  navbar:
    background: '#102b3f'
    left:
      - href: index.qmd
        text: Overview
      - href: introduction.qmd
        text: Introduction
      - href: market_baseline.qmd
        text: Market and EDA
      - href: career_evaluation.qmd
        text: Evaluation
  sidebar:
    style: docked
    contents:
      - index.qmd
      - introduction.qmd
      - data_preparation.qmd
      - market_baseline.qmd
      - skill_gap_analysis.qmd
      - career_evaluation.qmd
      - final_recommendations.qmd
      - references.qmd
      - ai-disclosure.qmd
  page-footer: 'Healthcare data analysts · NAICS 62 · January–September 2026 sample'
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    link-external-newwindow: true
    code-copy: true
    smooth-scroll: true
    date-format: long
execute:
  enabled: false
lang: en
bibliography: reference.bib
link-citations: true
