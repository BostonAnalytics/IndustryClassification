on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python for static asset verification
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify saved exports (no dataset or analysis dependencies)
        run: |
          python scripts/verify_static_assets.py
          python scripts/verify_multiclass.py

      - name: Render saved content and check links
        run: |
          quarto render final_report.qmd --to docx
          quarto render
          python scripts/verify_site.py
          python scripts/verify_sample.py
          python scripts/verify_multiclass.py --published

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
